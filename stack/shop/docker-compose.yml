# Sellarus — one shop (written to /opt/sellarus/shops/<shop> by install.sh, editable by hand).
# web : the Sellarus image (Apache + PHP), application files in the "www" volume
# db  : MariaDB, data in the "db" volume
# The project name (COMPOSE_PROJECT_NAME in .env) is sellarus-<shop>; the shared Caddy of the server reaches
# the shop under the name sellarus-<shop> on the "sellarus-proxy" network.
services:
  web:
    image: ghcr.io/nitrus21/sellarus:${SELLARUS_TAG:-latest}
    restart: unless-stopped
    environment:
      SELLARUS_DB_HOST: db
      SELLARUS_DB_PORT: "3306"
      SELLARUS_DB_NAME: ${DB_NAME}
      SELLARUS_DB_USER: ${DB_USER}
      SELLARUS_DB_PASSWORD: ${DB_PASSWORD}
      SELLARUS_DB_PREFIX: ${DB_PREFIX:-vb_}
    volumes:
      - www:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
      proxy:
        aliases:
          - sellarus-${SHOP}

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

volumes:
  www:
  db:

networks:
  internal:
  proxy:
    external: true
    name: sellarus-proxy
